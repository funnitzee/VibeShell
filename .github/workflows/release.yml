name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    name: build package
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install packages
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Sy --noconfirm --needed archlinux-keyring
          pacman -S --noconfirm --needed git

      - name: Build package
        run: |
          set -euo pipefail

          # makepkg refuses to run as root; base-devel runs as root.
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"

          # Pin the -git source to this exact tag instead of the branch tip.
          sed -i "s#git+https://github.com/funnitzee/VibeShell.git#&\\#tag=${GITHUB_REF_NAME}#" \
            packaging/PKGBUILD
          grep '^source=' packaging/PKGBUILD

          su builder -c 'cd packaging && makepkg -f --noconfirm --nodeps'

          cd packaging
          pkgfile=$(ls -1 ./*.pkg.tar.zst | head -1)
          sha256sum "$pkgfile" > "$pkgfile.sha256"
          echo "built: $pkgfile"
          cat "$pkgfile.sha256"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            packaging/*.pkg.tar.zst
            packaging/*.pkg.tar.zst.sha256
